<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="300" fill="#ffffff" rx="8"/>

  <!-- coach labels -->
  <g font-size="22" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="120" y="40">A1</text>
    <text x="360" y="40">A4</text>
    <text x="600" y="40">A3</text>
    <text x="840" y="40">A5</text>
    <text x="1080" y="40">A2</text>
  </g>

  <!-- train body: 5 coach blocks with small gaps at articulation points -->
  <g stroke="#111827" stroke-width="2" fill="#e5e7eb">
    <rect x="20"  y="60" width="200" height="70" rx="10"/>
    <rect x="260" y="60" width="200" height="70" rx="6"/>
    <rect x="500" y="60" width="200" height="70" rx="6"/>
    <rect x="740" y="60" width="200" height="70" rx="6"/>
    <rect x="980" y="60" width="200" height="70" rx="10"/>
  </g>

  <!-- axle positions (x centers) and type -->
  <!-- 1:R(A1 outer) 2:R(A1/A4 shared)  3:M 4:M (A4 outer/shared) ... -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <!-- bogie 1: A1 extremo -->
    <circle cx="55"  cy="150" r="16" fill="#2563eb"/><text x="55" y="156" fill="#fff">R</text>
    <circle cx="105" cy="150" r="16" fill="#2563eb"/><text x="105" y="156" fill="#fff">R</text>

    <!-- bogie 2: A1-A4 compartido -->
    <circle cx="235" cy="150" r="16" fill="#dc2626"/><text x="235" y="156" fill="#fff">M</text>
    <circle cx="285" cy="150" r="16" fill="#dc2626"/><text x="285" y="156" fill="#fff">M</text>

    <!-- bogie 3: A4-A3 compartido -->
    <circle cx="475" cy="150" r="16" fill="#dc2626"/><text x="475" y="156" fill="#fff">M</text>
    <circle cx="525" cy="150" r="16" fill="#2563eb"/><text x="525" y="156" fill="#fff">R</text>

    <!-- bogie 4: A3-A5 compartido -->
    <circle cx="715" cy="150" r="16" fill="#2563eb"/><text x="715" y="156" fill="#fff">R</text>
    <circle cx="765" cy="150" r="16" fill="#dc2626"/><text x="765" y="156" fill="#fff">M</text>

    <!-- bogie 5: A5-A2 compartido -->
    <circle cx="955"  cy="150" r="16" fill="#dc2626"/><text x="955" y="156" fill="#fff">M</text>
    <circle cx="1005" cy="150" r="16" fill="#dc2626"/><text x="1005" y="156" fill="#fff">M</text>

    <!-- bogie 6: A2 extremo -->
    <circle cx="1135" cy="150" r="16" fill="#2563eb"/><text x="1135" y="156" fill="#fff">R</text>
    <circle cx="1185" cy="150" r="16" fill="#2563eb"/><text x="1185" y="156" fill="#fff">R</text>
  </g>

  <!-- bogie group ellipses -->
  <g fill="none" stroke-width="4">
    <ellipse cx="80"   cy="150" rx="55" ry="34" stroke="#16a34a"/>
    <ellipse cx="260"  cy="150" rx="55" ry="34" stroke="#7c3aed"/>
    <ellipse cx="500"  cy="150" rx="55" ry="34" stroke="#7c3aed"/>
    <ellipse cx="740"  cy="150" rx="55" ry="34" stroke="#7c3aed"/>
    <ellipse cx="980"  cy="150" rx="55" ry="34" stroke="#7c3aed"/>
    <ellipse cx="1160" cy="150" rx="55" ry="34" stroke="#16a34a"/>
  </g>

  <!-- legend -->
  <g font-size="16" fill="#111827">
    <circle cx="140" cy="220" r="10" fill="#dc2626"/>
    <text x="160" y="226">Ejes motores (6)</text>

    <circle cx="140" cy="250" r="10" fill="#2563eb"/>
    <text x="160" y="256">Ejes remolques (6)</text>

    <circle cx="420" cy="220" r="10" fill="#16a34a"/>
    <text x="440" y="226">Bogies extremos (2)</text>

    <circle cx="420" cy="250" r="10" fill="#7c3aed"/>
    <text x="440" y="256">Bogies compartidos (4)</text>

    <text x="700" y="220" font-weight="700">12 ejes.</text>
    <text x="700" y="250" font-weight="700">6 bogies.</text>
  </g>
</svg>

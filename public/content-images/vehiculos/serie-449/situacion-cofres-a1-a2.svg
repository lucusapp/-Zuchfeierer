<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#ffffff" rx="8"/>

  <text x="560" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#7f1d1d">
    SITUACIÓN DE COFRES — SEMITREN A1-A2
  </text>

  <!-- coach (vertical pill) -->
  <rect x="500" y="55" width="110" height="560" rx="52" fill="#fecaca" stroke="#7f1d1d" stroke-width="2.5"/>
  <text x="555" y="335" text-anchor="middle" font-size="26" font-weight="800" fill="#7f1d1d"
        transform="rotate(-90 555 335)">A1-A2</text>
  <text x="555" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">A1</text>
  <text x="555" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">A2</text>

  <!-- continuation stub to rest of train -->
  <rect x="530" y="18" width="18" height="18" fill="#ffffff" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="450" y1="10" x2="530" y2="27" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="380" y="14" font-size="11" fill="#7f1d1d">(continúa hacia A4)</text>

  <!-- bottom connectors -->
  <rect x="518" y="608" width="16" height="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="546" y="608" width="16" height="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="574" y="608" width="16" height="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="2"/>

  <!-- ==== LEFT BOXES ==== -->
  <!-- Panel de Auxiliares -->
  <rect x="30" y="60" width="150" height="420" rx="10" fill="#fbcfe8" stroke="#7f1d1d" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Panel de Auxiliares</text>
  <g font-size="12.5" fill="#7f1d1d">
    <text x="45" y="115">• 2 llaves bocinas</text>
    <text x="45" y="140">• 2 llaves espejos</text>
    <text x="45" y="165">• Desacoplador</text>
    <text x="45" y="190">• Engrasador pestaña</text>
  </g>
  <polyline points="105,480 105,624 518,616" fill="none" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Sifa -->
  <rect x="210" y="150" width="140" height="230" rx="10" fill="#fbcfe8" stroke="#7f1d1d" stroke-width="2"/>
  <text x="280" y="175" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Sifa</text>
  <g font-size="12.5" fill="#7f1d1d">
    <text x="222" y="205">• Apertura manual</text>
    <text x="222" y="222">  trampilla</text>
    <text x="222" y="248">• Llave junta hinchable</text>
    <text x="222" y="265">  puerta</text>
  </g>
  <polyline points="280,380 280,616 546,616" fill="none" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Dotacion -->
  <rect x="380" y="60" width="105" height="420" rx="10" fill="#fbcfe8" stroke="#7f1d1d" stroke-width="2"/>
  <text x="432" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Dotación</text>
  <g font-size="11.5" fill="#7f1d1d">
    <text x="392" y="115">• Enganche de</text>
    <text x="392" y="130">  transición (A1)</text>
    <text x="392" y="160">• Bulones de</text>
    <text x="392" y="175">  Levante (A2)</text>
  </g>
  <polyline points="432,60 432,40 555,40 555,55" fill="none" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>
  <polyline points="432,480 432,616 574,616" fill="none" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ==== RIGHT BOXES ==== -->
  <!-- Panel Generacion de TFA -->
  <rect x="730" y="270" width="170" height="90" rx="10" fill="#fbcfe8" stroke="#7f1d1d" stroke-width="2"/>
  <text x="815" y="295" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7f1d1d">Panel Generación de TFA</text>
  <text x="745" y="322" font-size="12" fill="#7f1d1d">• Llave de aislamiento del panel.</text>
  <line x1="730" y1="315" x2="610" y2="300" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Panel Auxiliar de freno -->
  <rect x="920" y="40" width="170" height="420" rx="10" fill="#fbcfe8" stroke="#7f1d1d" stroke-width="2"/>
  <text x="1005" y="65" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7f1d1d">Panel Auxiliar de freno</text>
  <g font-size="11" fill="#7f1d1d">
    <text x="935" y="95">• Llave Freno de</text>
    <text x="935" y="110">  Estacionamiento BE</text>
    <text x="935" y="132">• Llave de suspensión BE</text>
    <text x="935" y="154">• Válvula de impulso</text>
    <text x="935" y="169">  Fre. de Estac. BE</text>
  </g>
  <line x1="920" y1="80" x2="610" y2="70" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowRed)"/>
</svg>

      <path d="M0,0 L10,5 L0,10 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="780" fill="#ffffff" rx="8"/>

  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="800" fill="#b91c1c">CIRCUITO DE POTENCIA</text>

  <!-- Catenaria -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="30"  y="55" width="150" height="38" rx="4" fill="#ffffff" stroke="#065f46" stroke-width="2"/>
    <text x="105" y="79" fill="#065f46">CATENARIA</text>
    <rect x="920" y="55" width="150" height="38" rx="4" fill="#ffffff" stroke="#065f46" stroke-width="2"/>

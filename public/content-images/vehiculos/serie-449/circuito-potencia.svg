  <line x1="110" y1="415" x2="110" y2="404" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="595" x2="180" y2="565" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="360" x2="395" y2="360" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrow)"/>

